apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stockpulse.fullname" . }}-secret
  labels:
    {{- include "stockpulse.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
