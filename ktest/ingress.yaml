apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stockpulse-ingress
  namespace: stockpulse
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stockpulse-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stockpulse-frontend
                port:
                  number: 80
