name: StockPulse CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  # =========================================================================
  # STAGE 1: AUTOMATED TESTING (Quality Gate 1)
  # =========================================================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        working-directory: backend
        run: |
          pytest -v --tb=short

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # =========================================================================
  # STAGE 2: BUILD DOCKER IMAGES
  # =========================================================================
  build-images:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Lowercase Repository Variables
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER_LC}/stockpulse-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER_LC}/stockpulse-frontend" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.BACKEND_IMAGE }}:latest \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -t ${{ env.FRONTEND_IMAGE }}:latest \
            ./frontend

      - name: Save Docker Images for Scanning
        run: |
          mkdir -p /tmp/docker-images
          docker save ${{ env.BACKEND_IMAGE }}:${{ github.sha }} -o /tmp/docker-images/backend.tar
          docker save ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} -o /tmp/docker-images/frontend.tar

      - name: Upload Docker Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: /tmp/docker-images/
          retention-days: 1

  # =========================================================================
  # STAGE 3: DEVSECOPS - TRIVY VULNERABILITY SCAN (Quality Gate 2)
  # =========================================================================
  security-scan:
    name: Security Vulnerability Scan (Trivy)
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Set Lowercase Repository Variables
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER_LC}/stockpulse-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER_LC}/stockpulse-frontend" >> $GITHUB_ENV

      - name: Download Built Images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/docker-images

      - name: Load Images into Docker
        run: |
          docker load -i /tmp/docker-images/backend.tar
          docker load -i /tmp/docker-images/frontend.tar

      - name: Install Trivy Security Scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan Backend Image for Vulnerabilities
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Scan Frontend Image for Vulnerabilities
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --format table ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  # =========================================================================
  # STAGE 4: PUSH IMAGES TO REGISTRY
  # =========================================================================
  push-images:
    name: Push Images to Container Registry
    needs: [build-images, security-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Set Lowercase Repository Variables
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER_LC}/stockpulse-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER_LC}/stockpulse-frontend" >> $GITHUB_ENV

      - name: Download Built Images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/docker-images

      - name: Load Images into Docker
        run: |
          docker load -i /tmp/docker-images/backend.tar
          docker load -i /tmp/docker-images/frontend.tar

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Container Images
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  # =========================================================================
  # STAGE 5: DEPLOY TO KUBERNETES (KIND CLUSTER INTEGRATION)
  # =========================================================================
  deploy:
    name: Deploy to Kubernetes
    needs: push-images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Lowercase Repository Variables
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER_LC}/stockpulse-backend" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER_LC}/stockpulse-frontend" >> $GITHUB_ENV

      - name: Download Built Images
        uses: actions/download-artifact@v4
        with:
          name: docker-images
          path: /tmp/docker-images

      - name: Load Images into Docker
        run: |
          docker load -i /tmp/docker-images/backend.tar
          docker load -i /tmp/docker-images/frontend.tar

      - name: Set up Kind (Kubernetes in Docker) Cluster
        uses: helm/kind-action@v1.9.0
        with:
          cluster_name: stockpulse-ci-cluster

      - name: Load Images into Kind Cluster
        run: |
          kind load docker-image ${{ env.BACKEND_IMAGE }}:${{ github.sha }} --name stockpulse-ci-cluster
          kind load docker-image ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} --name stockpulse-ci-cluster

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify Cluster Health
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Apply Namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Deploy StockPulse via Helm Chart
        run: |
          helm upgrade --install stockpulse ./helm/stockpulse \
            --namespace stockpulse \
            --set backend.image.repository=${{ env.BACKEND_IMAGE }} \
            --set backend.image.tag=${{ github.sha }} \
            --set backend.image.pullPolicy=Never \
            --set frontend.image.repository=${{ env.FRONTEND_IMAGE }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set frontend.image.pullPolicy=Never \
            --set backend.replicaCount=2 \
            --set frontend.replicaCount=2

      - name: Verify Deployment Rollout & Cluster Resources
        run: |
          kubectl rollout status deployment/stockpulse-backend -n stockpulse --timeout=90s || true
          kubectl rollout status deployment/stockpulse-frontend -n stockpulse --timeout=90s || true
          kubectl get pods -n stockpulse
          kubectl get svc -n stockpulse
