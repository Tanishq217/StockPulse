# Prometheus Helm Values for scraping StockPulse Application Metrics
server:
  global:
    scrape_interval: 15s
    evaluation_interval: 15s

extraScrapeConfigs: |
  - job_name: 'stockpulse-backend'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['stockpulse-backend.stockpulse.svc.cluster.local:8000']
        labels:
          app: 'stockpulse'
          environment: 'production'
          tier: 'backend'

alertmanager:
  enabled: false

pushgateway:
  enabled: false
